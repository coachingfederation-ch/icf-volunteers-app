# XcodeGen project spec for the ICF Switzerland volunteer-chat iOS wrapper.
# Generate the .xcodeproj with:  xcodegen generate
# (Install XcodeGen via:  brew install xcodegen)

name: ICFVolunteers
options:
  bundleIdPrefix: ch.coachingfederation
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 78U79ZZ8M4
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"

targets:
  ICFVolunteers:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ICFVolunteers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.coachingfederation.icf.volunteers
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ICFVolunteers/Info.plist
        CODE_SIGN_ENTITLEMENTS: ICFVolunteers/ICFVolunteers.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        UILaunchStoryboardName: LaunchScreen
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    entitlements:
      path: ICFVolunteers/ICFVolunteers.entitlements
      properties:
        aps-environment: development
